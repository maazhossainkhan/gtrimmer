<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b14">
  <title>Signing in — Google Trim by Shadow</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="../js/supabase-config.js" defer></script>
  <script src="../js/telegram-callback.js" defer></script>
</head>
<body>
  <main class="auth-wrap">
    <section class="auth-card" aria-labelledby="callbackTitle">
      <div class="auth-symbol" aria-hidden="true">S</div>
      <div class="eyebrow"><span class="eyebrow-star" aria-hidden="true">✦</span> Shadow link tools</div>
      <h1 class="auth-title" id="callbackTitle">Verifying<span>your Telegram sign-in.</span></h1>
      <p class="auth-description" id="callbackMessage" role="status" aria-live="polite">Please keep this page open while we verify the signed login response.</p>
      <p class="auth-feedback is-error" id="callbackError" hidden></p>
      <a class="secondary-button" id="backHomeLink" href="/" hidden>Return to Google Trim</a>
    </section>
  </main>
</body>
</html>
